<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* Yükleniyor Göstergesi */
        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            z-index: 10;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.15);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tam Ekran Power BI iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Yüklenme animasyonu (rapor gelene kadar gösterilir) -->
    <div class="loading-screen" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Power BI Embed -->
    <iframe 
        title="dashboard-son" 
        src="https://app.powerbi.com/reportEmbed?reportId=6a9535b9-e3e9-4dad-9262-9fff250fa423&autoAuth=true&ctid=633f72ac-b571-4a8d-9c8e-e17737376e6a" 
        allowFullScreen="true"
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 300);
            }
        }

        // 5 saniye sonra yükleyiciyi otomatik kapat (tedbir amaçlı)
        setTimeout(hideLoader, 5000);
    </script>
</body>
</html>
